     Source of truth: brainos supabase/functions/brain-mcp/consent/index.html. Holds no secret:
     it copies the OAuth query params into a form that POSTs (with the passphrase) to the function. -->

<title>BrainOS sign-in</title>
<style>body{font:16px system-ui;max-width:420px;margin:12vh auto;padding:0 16px;color:#111;background:#fafafa}
@media(prefers-color-scheme:dark){body{color:#eee;background:#111}input{background:#222;color:#eee}}
input[type=password]{width:100%;padding:10px;font-size:16px;box-sizing:border-box;margin:8px 0}button{padding:10px 18px;font-size:16px}</style>
</head><body>
<h2>Connect to brain-mcp</h2>
<p>A client returning to <b id="h">?</b> wants <b>read-only</b> access (scope <code>read</code>; the server grants nothing else) to Devin's BrainOS memory. Only allow it if you just clicked Connect in claude.ai.</p>
<form id="f" method="post" action="https://tnkximbzdxbjnkscjutm.supabase.co/functions/v1/brain-mcp/authorize">

<script>(function(){var f=document.getElementById("f");if(top!==self){document.body.textContent="Refusing to load in a frame.";return;}var q=new URLSearchParams(location.search),r="";try{r=new URL(q.get("redirect_uri")).host;}catch(e){f.remove();document.getElementById("h").textContent="(missing redirect_uri)";return;}document.getElementById("h").textContent=r;["client_id","redirect_uri","code_challenge","code_challenge_method","state","scope","resource","response_type"].forEach(function(k){var i=document.createElement("input");i.type="hidden";i.name=k;i.value=q.get(k)||"";f.appendChild(i);});})();</script>
</body></html>
